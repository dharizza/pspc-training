entity.deletion_record.settings:
  path: 'admin/structure/deletion-record'
  defaults:
    _form: '\Drupal\audit\Form\DeletionRecordSettingsForm'
    _title: 'Deletion Record'
  requirements:
    _permission: 'administer deletion_record'

audit.incident_report:
  path: '/audit/incident-report'
  defaults:
    _title: 'Incident Report'
    _form: 'Drupal\audit\Form\IncidentReportForm'
  requirements:
    _permission: 'access content'
