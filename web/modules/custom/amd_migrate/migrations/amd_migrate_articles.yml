id: amd_migrate_articles
label: Articles
migration_tags:
  - articles
  - csv
source:
  plugin: csv
  path: modules/custom/amd_migrate/data/articles.csv
  ids: [id]
  delimiter: ','
  enclosure: '"'
  header_offset: 0
  fields:
    -
      name: id
      label: ID
    -
      name: title
      label: Title
    -
      name: body
      label: Body
process:
  # See https://www.drupal.org/node/2129651 on how to define
  # process map for the migration.
  langcode:
    plugin: default_value
    default_value: 'en'
  type:
    plugin: default_value
    default_value: 'article'
  status:
    plugin: default_value
    default_value: 1
  uid:
    plugin: default_value
    default_value: 1
  title: title
  body: body
destination:
  plugin: entity:node
# The general rule of thumb is that any migrations referenced by migration
# process plugins should be required here.
#migration_dependencies:
#  required:
#    - example
